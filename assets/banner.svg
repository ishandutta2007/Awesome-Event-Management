<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Style for Animations -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .anim-orb-1 {
        transform-origin: 250px 200px;
        animation: pulseOrb 8s ease-in-out infinite alternate;
      }
      .anim-orb-2 {
        transform-origin: 950px 150px;
        animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      }
      .anim-stream {
        stroke-dasharray: 12, 12;
        animation: streamFlow 10s linear infinite;
      }
      .anim-stream-fast {
        stroke-dasharray: 8, 8;
        animation: streamFlow 5s linear infinite;
      }
      .anim-pill-1 { animation: floatPill 4s ease-in-out infinite; }
      .anim-pill-2 { animation: floatPill 4.5s ease-in-out infinite 0.7s; }
      .anim-pill-3 { animation: floatPill 5s ease-in-out infinite 1.4s; }
      .anim-pill-4 { animation: floatPill 4.2s ease-in-out infinite 2.1s; }
      .radar-sweep-center {
        transform-origin: 1060px 100px;
        animation: radarSweep 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="anim-orb-1" cx="220" cy="180" r="160" fill="url(#glowGrad1)" filter="url(#glowFilter)" />
  <circle class="anim-orb-2" cx="980" cy="160" r="180" fill="url(#glowGrad2)" filter="url(#glowFilter)" />

  <!-- Animated Circuit & Data Streams (Background layer) -->
  <g opacity="0.35">
    <path class="anim-stream" d="M -20,90 Q 250,30 500,100 T 1000,70 T 1220,110" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="anim-stream-fast" d="M -20,330 Q 300,380 600,320 T 1100,350 T 1220,320" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="anim-stream" d="M 150,440 L 280,310 L 450,310 L 520,380 L 850,380" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <path class="anim-stream" d="M 800,20 L 920,140 L 1150,140" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Interactive Graphic Node - Event Stream Visualizer (Right Side) -->
  <g transform="translate(850, 70)" opacity="0.85">
    <circle cx="210" cy="120" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" />
    <circle cx="210" cy="120" r="75" fill="none" stroke="#475569" stroke-width="1.5" />
    <circle cx="210" cy="120" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Radar beam -->
    <g class="radar-sweep-center" transform-origin="210 120">
      <line x1="210" y1="120" x2="320" y2="120" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />
      <polygon points="210,120 315,95 320,120" fill="#38bdf8" opacity="0.15" />
    </g>

    <!-- Node dots -->
    <circle cx="210" cy="120" r="8" fill="#38bdf8" />
    <circle cx="135" cy="120" r="6" fill="#ec4899" />
    <circle cx="270" cy="70" r="5" fill="#10b981" />
    <circle cx="250" cy="180" r="5" fill="#f59e0b" />
    <circle cx="170" cy="65" r="4" fill="#818cf8" />
  </g>

  <!-- Header Badge: AWESOME LIST -->
  <g transform="translate(80, 52)">
    <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" />
    <text x="30" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED RESOURCE</text>
  </g>

  <!-- Primary Foreground Content: Title & Subtitle -->
  <!-- Guaranteed high contrast, clean layering, completely unobstructed -->
  <g transform="translate(80, 142)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#accentGrad)" letter-spacing="-1">
      Awesome Event Management
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Enterprise IT Event Correlation, AIOps, Observability Pipelines &amp; Incident Automation
    </text>
  </g>

  <!-- Dynamic Feature Badges / Action Pills -->
  <g transform="translate(80, 240)">
    <!-- Pill 1: Incident Correlation -->
    <g class="anim-pill-1" transform="translate(0, 0)">
      <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Event Correlation</text>
    </g>

    <!-- Pill 2: AIOps & Alert Noise Reduction -->
    <g class="anim-pill-2" transform="translate(202, 0)">
      <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#818cf8" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🧠 AIOps &amp; Noise Filter</text>
    </g>

    <!-- Pill 3: Enterprise SaaS Pricing -->
    <g class="anim-pill-3" transform="translate(404, 0)">
      <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#c084fc" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">💎 SaaS Pricing Intel</text>
    </g>

    <!-- Pill 4: Open-Source Stacks -->
    <g class="anim-pill-4" transform="translate(606, 0)">
      <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#10b981" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 10+ OSS Solutions</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Strip -->
  <g transform="translate(80, 340)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      📊 Comprehensive Guide for SRE, DevOps, Platform Engineers &amp; ITOps Teams
    </text>
    <line x1="0" y1="16" x2="1040" y2="16" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
  </g>
</svg>
